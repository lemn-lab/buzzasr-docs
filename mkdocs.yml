site_name: BuzzASR
site_description: A short technical overview of BuzzASR, a set of 100+ monolingual Whisper-based ASR models for FLEURS languages.
site_url: https://lemn-lab.github.io/buzzasr-docs/
repo_url: https://github.com/lemn-lab/buzzasr-docs
repo_name: lemn-lab/buzzasr-docs
edit_uri: edit/main/docs/
copyright: In collaboration with EleutherAI

theme:
  name: material
  palette:
    # Auto-detect light/dark mode preference, with toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant       # smooth transitions
    - navigation.tracking      # update URL with scroll position
    - navigation.tabs          # top-level tabs
    - navigation.sections      # show sections in nav
    - navigation.expand        # expand sections by default
    - navigation.top           # back-to-top button
    - search.suggest
    - search.highlight
    - content.code.copy        # one-click code copy button
    - content.code.annotate    # numbered code annotations
    - content.tabs.link        # link content tabs across page

markdown_extensions:
  # Standard
  - admonition                 # note/warning/tip callouts
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # PyMdown
  - pymdownx.details           # collapsible sections
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Technical overview: overview.md
  - The tokenizer: tokenizer.md
  - Results: results.md
  - Models: models.md
  - Reference:
      - Glossary: reference/glossary.md
      - Citations: reference/citations.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vamsin07
  generator: false              # remove "Made with Material for MkDocs" footer
